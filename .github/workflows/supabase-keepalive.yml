# Free Supabase projects pause after 7 days without activity. This makes a tiny read every 3 days so they never do.
# Uses the Cookbook's public URL + anon key.
name: Supabase keep-alive
on:
  schedule: [{ cron: '17 9 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: https://zikseitbcvmkuljmbpxs.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inppa3NlaXRiY3Zta3Vsam1icHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjMxMzYsImV4cCI6MjEwNzg5OTEzNn0.Cso2GabI-0poCbzgVEWQRfpi1pZiFmzNfQhNGCKu1Mc
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase secrets; skipping"; exit 0; fi
          curl -sS -o /dev/null -w "%{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          curl -sS -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/" -H "apikey: $KEY"
