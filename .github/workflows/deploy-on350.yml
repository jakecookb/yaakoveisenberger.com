# Publishes On350: the app (built files in on350-app/dist) to the "on350" Worker (app.on350.com), and the landing page
# (on350-landing/site) to the "on350-landing" Worker (on350.com). Runs when either changes on main, or by hand.
# Uses the same CLOUDFLARE_API_TOKEN secret as the main site; the custom domains are attached separately.
name: Deploy On350 app
on:
  push:
    branches: [main]
    paths: ['on350-app/**', 'on350-landing/**']
  workflow_dispatch:
concurrency: deploy-on350
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 76a00e3c24e864fe9f357aeeb865ab57
        run: |
          npx --yes wrangler@4 deploy --config on350-app/wrangler.jsonc
          npx --yes wrangler@4 deploy --config on350-landing/wrangler.jsonc
